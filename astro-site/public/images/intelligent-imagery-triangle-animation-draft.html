<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Intelligent Imagery — Triangle Animation Draft</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #fff;
        font-family: system-ui, sans-serif;
      }
      .stage {
        width: min(100vw, 1200px);
        padding: 24px;
      }
      svg {
        display: block;
        width: 100%;
        height: auto;
        overflow: visible;
      }
      .triangle-left {
        transform-box: view-box;
        transform-origin: 233px 300px;
        transform: rotate(-90deg);
        animation: left-in 2.1s cubic-bezier(0.2, 0.75, 0.2, 1) 0.15s forwards;
        will-change: transform;
        opacity: 0.72;
      }

      .triangle-right {
        transform-box: view-box;
        transform-origin: 767px 300px;
        transform: rotate(-90deg);
        animation: right-in 2.1s cubic-bezier(0.2, 0.75, 0.2, 1) 0.15s forwards;
        will-change: transform;
      }
      @keyframes left-in {
        from {
          transform: translate(0, 0) rotate(-90deg);
        }
        to {
          transform: translate(267px, 0) rotate(0deg);
        }
      }
      @keyframes right-in {
        from {
          transform: translate(0, 0) rotate(-90deg);
        }
        to {
          transform: translate(-267px, 0) rotate(0deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .triangle-left {
          animation: none;
          transform: translate(267px, 0) rotate(0deg);
        }

        .triangle-right {
          animation: none;
          transform: translate(-267px, 0) rotate(0deg);
        }

        .globe,
        .word-intelligent,
        .word-imagery {
          animation: none;
          opacity: 1;
          transform: none;
        }
      }
      .globe {
        opacity: 0;
        animation: globe-appear 0.95s ease-out 0.85s both;
      }

      @keyframes globe-appear {
        to {
          opacity: 1;
        }
      }

      .word-intelligent {
        animation: word-left-in 1.9s cubic-bezier(0.2, 0.75, 0.2, 1) 1.05s both;
      }

      .word-imagery {
        animation: word-right-in 1.9s cubic-bezier(0.2, 0.75, 0.2, 1) 1.05s both;
      }

      @keyframes word-left-in {
        from {
          opacity: 0;
          transform: translateX(-45px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      @keyframes word-right-in {
        from {
          opacity: 0;
          transform: translateX(45px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }
    </style>
  </head>
  <body>
    <main class="stage" aria-label="Animated Intelligent Imagery logo concept">
      <svg viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
        <title id="title">
          Two colored triangles converge into an overlapping geometric symbol
        </title>
        <desc id="desc">
          A red-green-blue filled triangle and a cyan-yellow-magenta filled
          triangle move toward the center, rotate, and overlap with partial
          transparency.
        </desc>
        <defs>
          <linearGradient id="leftGradient" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#00FF00" />
            <stop offset="45%" stop-color="#0000FF" />
            <stop offset="69%" stop-color="#FF0000" />
          </linearGradient>
          <linearGradient id="rightGradient" x1="1" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#FF00FF" />
            <stop offset="49%" stop-color="#00FFFF" />
            <stop offset="60%" stop-color="#FFFF00" />
          </linearGradient>
        </defs>

        <!-- The two source triangles remain filled; transparency is applied to the
       complete shapes so their colors blend naturally where they overlap. -->
        <g class="triangle-left" opacity="0.82">
          <polygon points="100,100 500,300 100,500" fill="url(#leftGradient)" />
        </g>
        <g class="triangle-right" opacity="0.82">
          <polygon
            points="900,100 500,300 900,500"
            fill="url(#rightGradient)"
          />
        </g>
        <defs>
          <radialGradient id="globeShading" cx="35%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#FFFFFF" />
            <stop offset="55%" stop-color="#FFFFFF" />
            <stop offset="85%" stop-color="#F0F0F0" />
            <stop offset="100%" stop-color="#C8C8C8" />
          </radialGradient>
        </defs>
        <g class="globe">
          <!-- Shaded globe -->
          <circle cx="500" cy="300" r="110" fill="url(#globeShading)" />

          <!-- Intelligent: upper line -->
          <g
            class="word-intelligent"
            font-family="Arial, sans-serif"
            font-weight="700"
            fill="#333333"
            text-anchor="middle"
          >
            <text
              class="word-intelligent"
              x="500"
              y="288"
              text-anchor="middle"
              font-family="Arial, sans-serif"
              font-weight="700"
              font-size="26"
              letter-spacing="1.5"
              fill="#222222"
            >
              INTELLIGENT
            </text>
          </g>

          <!-- Imagery: lower line -->
          <g
            class="word-imagery"
            font-family="Arial, sans-serif"
            font-weight="700"
            fill="#333333"
            text-anchor="middle"
          >
            <text
              class="word-imagery"
              x="500"
              y="326"
              text-anchor="middle"
              font-family="Arial, sans-serif"
              font-weight="700"
              font-size="26"
              letter-spacing="3"
              fill="#222222"
            >
              IMAGERY
            </text>
          </g>
        </g>
      </svg>
    </main>
  </body>
</html>
