
name: Deploy Intelligent Imagery

on:
  workflow_dispatch:
  repository_dispatch:
    types: [sanity-publish]

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Build and deploy site
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: astro-site/package-lock.json

      - name: Install dependencies
        working-directory: astro-site
        run: npm ci

      - name: Build Astro site
        working-directory: astro-site
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::922954050442:role/IntelligentImageryDeploymentPolicy
          aws-region: us-east-1

      - name: Deploy site to S3
        run: aws s3 sync astro-site/dist/ s3://intelligentimagery.com/

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id EN09QW6L792PZ --paths "/*"
